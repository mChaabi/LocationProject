<nav class="navbar">
  <div class="nav-container">
    <div class="logo">
      <a routerLink="/home">Auto<span>Drive</span></a>
    </div>

    <button class="burger" (click)="toggleMenu()" [class.open]="isMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" [class.active]="isMenuOpen">
      <li><a routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Accueil</a></li>
      <li><a routerLink="/cars" routerLinkActive="active" (click)="closeMenu()">Voitures</a></li>

      @if (authService.currentUser()) {
        <li>
          <a routerLink="/mes-reservations" routerLinkActive="active" (click)="closeMenu()"
            >Mes Réservations</a
          >
        </li>
      }
      <li><a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">À propos</a></li>
      <li>
        <a routerLink="/reservations" routerLinkActive="active" (click)="closeMenu()"
          >Mes Réservations</a
        >
      </li>
      @if (authService.isAdmin()) {
        <li><a routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">Admin</a></li>
      }
      <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a></li>
      @if (authService.currentUser()) {
        <li>
          <button (click)="authService.logout(); closeMenu()" class="btn-logout">
            Déconnexion
          </button>
        </li>
      } @else {
        <li>
          <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Connexion</a>
        </li>
        <li><a routerLink="/register" class="btn-auth" (click)="closeMenu()">Inscription</a></li>
      }
    </ul>
  </div>
</nav>
