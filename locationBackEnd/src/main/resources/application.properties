spring.application.name=locationBackEnd
# ===============================
# 1. CONFIGURATION DE L'API
# ===============================
# Préfixe global pour tous les endpoints
server.servlet.context-path=/api

# ===============================
# 2. CONFIGURATION POSTGRESQL
# ===============================
# Remplacez 'db_location' par votre hôte (ex: localhost) et 'votre_bdd' par le nom de votre base
spring.datasource.url=jdbc:postgresql://localhost:5432/location
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 3. CONFIGURATION JPA / HIBERNATE
# ===============================
# Crée ou met à jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update

# Dialecte spécifique pour PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Debug : voir le SQL dans les logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true