spring.application.name=locationBackEnd
# ===============================
# 1. CONFIGURATION DE L'API
# ===============================
# Préfixe global pour tous les endpoints
server.servlet.context-path=/api

# ===============================
# 2. CONFIGURATION MYSQL
# ===============================
# Remplacez 'localhost' par votre hôte et 'location' par le nom de votre base MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/location?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# 3. CONFIGURATION JPA / HIBERNATE
# ===============================
# Crée ou met à jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update

# Dialecte spécifique pour MySQL (optionnel en Spring Boot 3+, Hibernate le détecte souvent automatiquement)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Debug : voir le SQL dans les logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true